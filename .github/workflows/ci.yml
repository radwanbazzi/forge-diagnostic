name: CI

# Free GitHub Actions: runs on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Wrangler requires Node >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web (Astro static landing)
        run: npm run build:web

      - name: Test
        run: npm test

      - name: Test web (fast-tap regression guard)
        run: npm --prefix web test

      - name: Build (dry-run — compiles the Worker without deploying)
        run: npx wrangler deploy --dry-run
