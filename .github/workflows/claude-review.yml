name: Claude Review

# Runs ONLY when someone writes "@claude" in a comment on a PR (or a PR review comment).
# It does NOT run automatically on every PR. Authentication uses a Pro/Max subscription
# OAuth token stored as a GitHub secret — NEVER an ANTHROPIC_API_KEY (that would bill you).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # Only fire when the comment mentions @claude.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Generate this token once with `claude setup-token` (Claude Code CLI) and add it
          # as the repository secret CLAUDE_CODE_OAUTH_TOKEN. Do NOT add an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 5"
